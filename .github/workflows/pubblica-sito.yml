name: Pubblica il sito ogni notte

# PERCHÉ ESISTE
# La mappa per i motori di ricerca e le pagine degli articoli — quelle
# che portano titolo e descrizione già scritti nel codice, senza dover
# eseguire il sito — vengono generate al momento della pubblicazione,
# leggendo gli articoli dal database.
#
# Ma gli articoli si scrivono dal pannello, non pubblicando il sito.
# Senza questa ripubblicazione notturna, un articolo scritto oggi non
# entrerebbe nella mappa finché qualcuno non ripubblica a mano — e
# Google lo troverebbe settimane dopo, o mai.
#
# Il sito non cambia: cambia solo ciò che i motori di ricerca leggono.

on:
  schedule:
    # 03:30 UTC = 05:30 in Italia. Di notte non c'è nessuno sul sito,
    # e gli articoli della giornata precedente sono tutti pubblicati.
    - cron: "30 3 * * *"
  # Bottone per lanciarla a mano quando serve subito
  workflow_dispatch:

# Due pubblicazioni sovrapposte si darebbero fastidio a vicenda
concurrency:
  group: pubblica-sito
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      # Le credenziali per caricare foto e video stanno nel file .env, che
      # NON viene caricato su GitHub (ed è giusto così). Qui arrivano dai
      # segreti del repository.
      #
      # ⚠️ Senza questo controllo la compilazione riesce lo stesso e
      # pubblica un sito in cui nessuno può più caricare un'immagine:
      # né foto profilo, né immagini in chat, né foto e video negli
      # articoli. È successo davvero il 29/08/2026. Meglio non
      # pubblicare che pubblicare un sito monco.
      - name: Controlla che le credenziali di caricamento ci siano
        env:
          NOME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
        run: |
          if [ -z "$NOME" ] || [ -z "$PRESET" ]; then
            echo "Mancano i segreti VITE_CLOUDINARY_CLOUD_NAME e/o VITE_CLOUDINARY_UPLOAD_PRESET."
            echo "Senza, il sito verrebbe pubblicato senza la possibilita' di caricare file."
            exit 1
          fi
          echo "credenziali di caricamento presenti"

      - name: Compila il sito e genera mappa e pagine articolo
        env:
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
        run: npm run build

      # Il controllo prima della compilazione dice che i valori c'erano;
      # questo dice che sono davvero finiti dentro al sito.
      - name: Controlla che il sito compilato sappia caricare i file
        env:
          NOME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
        run: |
          grep -rqF "$NOME" dist/assets || {
            echo "il sito compilato non contiene le credenziali di caricamento, mi fermo"
            exit 1
          }
          echo "credenziali presenti nel sito compilato"

      # Se la generazione non ha prodotto nulla, meglio fermarsi che
      # pubblicare un sito senza mappa sovrascrivendo quella buona.
      - name: Controlla che la mappa ci sia
        run: |
          test -f dist/sitemap.xml || { echo "mappa non generata"; exit 1; }
          RIGHE=$(grep -c "<loc>" dist/sitemap.xml)
          echo "indirizzi nella mappa: $RIGHE"
          test "$RIGHE" -ge 8 || { echo "mappa troppo corta, mi fermo"; exit 1; }

      - name: Pubblica su Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: netflaxt-news
          channelId: live
