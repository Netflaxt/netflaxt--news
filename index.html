<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />

    <!-- Un solo indirizzo ufficiale: netflaxt.it
         Firebase assegna d'ufficio anche netflaxt-news.web.app e
         netflaxt-news.firebaseapp.com, e non è possibile eliminarli.
         Chi ci arriva viene portato qui, così il sito risponde a un solo
         nome: meglio per i visitatori e per Google, che altrimenti
         troverebbe lo stesso sito su tre indirizzi diversi.
         Sta in cima e prima di tutto il resto per evitare che si veda
         un lampo della pagina prima del cambio. -->
    <script>
      (function () {
        var indirizziFirebase = [
          "netflaxt-news.web.app",
          "netflaxt-news.firebaseapp.com",
        ];
        if (indirizziFirebase.indexOf(location.hostname) !== -1) {
          location.replace(
            "https://netflaxt.it" +
              location.pathname +
              location.search +
              location.hash
          );
        }
      })();
    </script>

    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070D" />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- 🦅 Preload immagine aquila: priorità massima per partenza istantanea
         dell'easter egg. Il verso (mp3) lo precarica la JS (preloadEagleCry)
         perché `as="audio"` non è supportato dai browser come preload. -->
    <link rel="preload" as="image" href="/eagle.png" fetchpriority="high" />

    <title>Netflaxt News · La casa dei tifosi laziali</title>
    <meta name="description" content="News, analisi, calciomercato, calendario e chat live sulla S.S. Lazio. Fan site indipendente biancoceleste." />
    <meta name="author" content="Netflaxt News" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://netflaxt.it/" />

    <!-- Carta d'identità del sito per i motori di ricerca: dice che
         Netflaxt News è una testata di notizie sportive in italiano,
         chi la pubblica e dove trovarla sui social. Serve a farsi
         riconoscere come fonte e non come pagina qualsiasi. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "NewsMediaOrganization",
            "@id": "https://netflaxt.it/#organizzazione",
            "name": "Netflaxt News",
            "url": "https://netflaxt.it/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://netflaxt.it/icon-512.png",
              "width": 512,
              "height": 512
            },
            "description": "Fan site indipendente sulla S.S. Lazio: notizie, calciomercato, calendario, pronostici e chat live per i tifosi biancocelesti.",
            "sameAs": ["https://www.instagram.com/netflaxt/"]
          },
          {
            "@type": "WebSite",
            "@id": "https://netflaxt.it/#sito",
            "url": "https://netflaxt.it/",
            "name": "Netflaxt News",
            "inLanguage": "it-IT",
            "publisher": { "@id": "https://netflaxt.it/#organizzazione" }
          }
        ]
      }
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Netflaxt News" />
    <meta property="og:title" content="Netflaxt News · La casa dei tifosi laziali" />
    <meta property="og:description" content="News, analisi, calciomercato e chat live sulla S.S. Lazio. Fan site indipendente biancoceleste." />
    <meta property="og:image" content="https://netflaxt.it/icon-512.png" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:url" content="https://netflaxt.it/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Netflaxt News · La casa dei tifosi laziali" />
    <meta name="twitter:description" content="News, analisi e chat live sulla S.S. Lazio." />
    <meta name="twitter:image" content="https://netflaxt.it/icon-512.png" />
    <script>
      // Anti-FOUC: applica il tema salvato prima del primo paint
      (function () {
        try {
          var t = localStorage.getItem("netflaxt_theme");
          if (t !== "light" && t !== "dark") t = "dark";
          document.documentElement.setAttribute("data-theme", t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", t === "light" ? "#EEF2F7" : "#05070D");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
